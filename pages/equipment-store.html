<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store - maocamera ltd</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
    /* 仅保留产品列表相关的样式，删除关于 header-grid 的固定定义 */
    .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 30px;
        margin-top: 40px;
    }
    .product-card {
        background: #fff;
        border: 1px solid #eee;
        border-radius: 8px;
        overflow: hidden;
        transition: transform 0.3s ease;
    }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    .product-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #f9f9f9; }
    .product-info { padding: 15px; }
    .product-name { font-weight: 600; margin-bottom: 5px; }
    .product-price { color: #007bff; font-weight: 700; }
</style>
</head>
<script src="/js/cart-logic.js"></script>
<script src="/js/badge-sync.js"></script>
<body>
<header class="main-header">
    <div class="container header-grid">
        <h1 class="logo">
            <a href="/">Mao Camera <span>ltd</span></a>
        </h1>

        <div class="search-bar store-search-centering">
            <input type="text" id="searchInput" placeholder="search">
        </div>

        <nav class="main-nav">
            <button class="nav-toggle" aria-label="toggle navigation">
                <span class="hamburger"></span>
            </button>
            <ul class="nav-links">
                <li><a href="/pages/film-development.html">Development</a></li>
                <li><a href="/pages/equipment-store.html">Store</a></li>
                <li>
                    <a href="cart.html" class="cart-icon-container">
                        <span id="cartBadge" class="cart-badge"></span>
                        🛒 CART
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>
    <main class="container">
        <div id="productGrid" class="product-grid">
            </div>
    </main>
    <script src="../js/cart-logic.js"></script>
    <script src="../js/store-logic.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const navToggle = document.querySelector('.nav-toggle');
        
        // 核心修复：手动为 Store 界的汉堡菜单绑定切换逻辑
        if (navToggle) {
            navToggle.onclick = (e) => {
                e.preventDefault();
                document.body.classList.toggle('nav-open');
                console.log('Menu toggled'); // 调试用，成功后可删除
            };
        }

        // 确保 Store 界的角标也能同步
        if (window.syncCartBadge) {
            window.syncCartBadge();
        }
    });
</script>

<script src="../js/cart-logic.js"></script>
<script src="../js/store-logic.js"></script
</body>
</html>
