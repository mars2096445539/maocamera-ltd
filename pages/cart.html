<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart - maocamera ltd</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="/js/badge-header.js"></script>
</head>
<body>

<div id="badge-header-placeholder"></div>

<main class="container cart-page-container">
    <h2 class="cart-page-title">MY CART</h2>
    
    <div class="cart-flex-wrapper">
        <div id="cartItems" class="cart-items-list"></div>

        <aside class="cart-summary-sidebar">
            <div class="summary-box">
                <h3 class="summary-title">ORDER SUMMARY</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <strong id="subtotalDisplay">$0.00</strong>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span class="shipping-free">FREE</span>
                </div>
                <div class="summary-row">
                    <span>Est. Tax (IL 9%)</span>
                    <strong id="taxDisplay">$0.00</strong>
                </div>
                <hr class="summary-divider">
                <div class="summary-row total-row">
                    <span>Total</span>
                    <strong id="totalDisplay">$0.00</strong>
                </div>
                
                <button id="checkoutBtn" class="checkout-button">CHECKING STOCK...</button>
                <p class="tax-location">Taxes calculated for Urbana, IL 61801</p>
            </div>
        </aside>
    </div>
</main>

<footer class="main-footer">
    <p>&copy; 2025 Mao Camera Limited Liability Company. All Rights Reserved.</p>
</footer>

<script>
/**
 * 核心：全局库存校验
 * 遍历购物车，只要有一件商品 canPurchase 为 false，就锁死按钮
 */
async function checkCartValidity() {
    const cart = JSON.parse(localStorage.getItem('maocamera_cart')) || [];
    const checkoutBtn = document.getElementById('checkoutBtn');
    
    if (cart.length === 0) {
        checkoutBtn.disabled = true;
        checkoutBtn.innerText = "CHECKOUT";
        return;
    }

    let allInStock = true;
    let outOfStockItem = "";

    try {
        for (const item of cart) {
            // 带有时间戳 t 的请求，确保拿到 Redis 最新的数字
            const res = await fetch(`/api/get-stock?name=${encodeURIComponent(item.name)}&t=${Date.now()}`);
            const data = await res.json();
            
            if (!data.canPurchase) {
                allInStock = false;
                outOfStockItem = item.name;
                break;
            }
        }

        if (!allInStock) {
            // 物理锁死按钮，应用灰色样式
            checkoutBtn.disabled = true;
            checkoutBtn.style.backgroundColor = "#666";
            checkoutBtn.style.cursor = "not-allowed";
            checkoutBtn.innerText = "MAINTENANCE / SOLD OUT";
            console.warn(`Item out of stock: ${outOfStockItem}`);
        } else {
            // 恢复正常
            checkoutBtn.disabled = false;
            checkoutBtn.style.backgroundColor = ""; 
            checkoutBtn.style.cursor = "pointer";
            checkoutBtn.innerText = "CHECKOUT";
        }
    } catch (err) {
        console.error("Stock check failed:", err);
        checkoutBtn.innerText = "SERVICE UNAVAILABLE";
    }
}

function updateCartAndUI(cart) {
    localStorage.setItem('maocamera_cart', JSON.stringify(cart));
    renderCart();
    checkCartValidity(); // 每次变动数量后重新校验
    if (window.syncCartBadge) window.syncCartBadge(); 
}

function renderCart() {
    const cart = JSON.parse(localStorage.getItem('maocamera_cart')) || [];
    const itemsDiv = document.getElementById('cartItems');
    
    if (cart.length === 0) {
        itemsDiv.innerHTML = `<div class="empty-cart-msg">Your cart is currently empty.</div>`;
        calculateTotals(0);
        return;
    }

    let runningSubtotal = 0;
    itemsDiv.innerHTML = cart.map((item, index) => {
        const itemTotal = item.price * item.quantity;
        runningSubtotal += itemTotal; 
        
        return `
            <div class="cart-item-card">
                <img src="${item.cover_image || '/api/placeholder/100/100'}" class="cart-item-img">
                <div class="cart-item-info">
                    <div class="cart-item-name">${item.name}</div>
                    <div class="cart-item-stock">Checked Live</div>
                    <div class="quantity-controls">
                        <button onclick="changeQty(${index}, -1)" class="qty-btn">-</button>
                        <span class="qty-num">${item.quantity}</span>
                        <button onclick="changeQty(${index}, 1)" class="qty-btn">+</button>
                        <button onclick="removeItem(${index})" class="remove-link">Remove</button>
                    </div>
                </div>
                <div class="cart-item-price">$${itemTotal.toFixed(2)}</div>
            </div>
        `;
    }).join('');

    calculateTotals(runningSubtotal);
}

function calculateTotals(subtotal) {
    const taxRate = 0.09; // Urbana, IL 税率
    const tax = subtotal * taxRate;
    const total = subtotal + tax;
    document.getElementById('subtotalDisplay').innerText = `$${subtotal.toFixed(2)}`;
    document.getElementById('taxDisplay').innerText = `$${tax.toFixed(2)}`;
    document.getElementById('totalDisplay').innerText = `$${total.toFixed(2)}`;
}

async function changeQty(index, delta) {
    let cart = JSON.parse(localStorage.getItem('maocamera_cart')) || [];
    const item = cart[index];
    if (!item) return;

    if (delta < 0) {
        item.quantity += delta;
        if (item.quantity < 1) item.quantity = 1;
        updateCartAndUI(cart);
        return;
    }

    try {
        const response = await fetch(`/api/get-stock?name=${encodeURIComponent(item.name)}&t=${Date.now()}`);
        const stockData = await response.json();

        if (item.quantity + 1 > stockData.stock) {
            alert(`Sorry, maocamera ltd currently only has ${stockData.stock} units of this item.`);
            return; 
        }

        item.quantity += 1;
        updateCartAndUI(cart);
    } catch (err) {
        alert("Unable to verify stock.");
    }
}

function removeItem(index) {
    let cart = JSON.parse(localStorage.getItem('maocamera_cart')) || [];
    cart.splice(index, 1);
    updateCartAndUI(cart);
}

// 支付按钮点击逻辑
document.getElementById('checkoutBtn').onclick = async () => {
    const btn = document.getElementById('checkoutBtn');
    if (btn.disabled) return;

    const currentCart = JSON.parse(localStorage.getItem('maocamera_cart')) || [];
    btn.innerText = "PROCESSING...";
    btn.disabled = true;

    try {
        const response = await fetch('/api/create-checkout-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items: currentCart })
        });

        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.error || "Checkout failed");
        }

        const session = await response.json();
        if (session.url) window.location.href = session.url;
    } catch (err) {
        alert("Checkout Failed: " + err.message);
        btn.innerText = "CHECKOUT";
        btn.disabled = false;
    }
};

document.addEventListener('DOMContentLoaded', () => {
    renderCart();
    checkCartValidity(); // 初始加载即检查
});
</script>
</body>
</html>
